# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 自建服务器
    - 所有-自动
    - 所有-手动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 韩国-故转
    - 新加坡-故转
    - 美国-故转
    - 德国-故转
    - 其他-故转
    - 拒绝

proxy-groups:
  # 1. 核心分类组
  - {name: 人工智能, <<: *default}
  
  - name: 自建服务器
    type: select
    proxies:
      - "233boy-爱尔兰"
      - "233boy-美国"
      - "Claw-德国-DE"

  # 2. 独立业务组
  - {name: 自定义, <<: *default}
  - {name: 油管视频, <<: *default}
  - {name: 社交平台X, <<: *default}
  - {name: TikTok, <<: *default}
  - {name: TradingView, <<: *default}
  - {name: 谷歌, <<: *default}  
  - {name: 微软, <<: *default}
  - {name: 苹果, <<: *default}
  - {name: 加密货币, <<: *default}
  - {name: 颜色, <<: *default}
  - {name: 测试, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 国内, <<: *default}
  - {name: 其他, <<: *default}  

  # 3. 基础逻辑组
  - name: 所有-手动
    type: select
    use: [牛逼机场, 赔钱机场]
    proxies: [自建服务器]

  - name: 所有-自动
    type: url-test
    use: [牛逼机场, 赔钱机场]
    proxies: [自建服务器]
    tolerance: 50
    interval: 180

  # 4. 地区分流组
  - name: 香港-故转
    type: fallback
    proxies: [香港-手动, 香港-自动]
  - name: 香港-手动
    type: select
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
  - name: 香港-自动
    type: url-test
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 台湾-故转
    type: fallback
    proxies: [台湾-手动, 台湾-自动]
  - name: 台湾-手动
    type: select
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
  - name: 台湾-自动
    type: url-test
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  - name: 日本-故转
    type: fallback
    proxies: [日本-手动, 日本-自动]
  - name: 日本-手动
    type: select
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 日本-自动
    type: url-test
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  - name: 韩国-故转
    type: fallback
    proxies: [韩国-手动, 韩国-自动]
  - name: 韩国-手动
    type: select
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(韩国|韓|KR|Korea|South Korea|🇰🇷)).*$"
  - name: 韩国-自动
    type: url-test
    use: [牛逼机场, 赔钱机场]
    filter: "(?=.*(韩国|韓|KR|Korea|South Korea|🇰🇷)).*$"

  - name: 新加坡-故转
